# Local build of worfy for the system it is built on. `pnpm package` runs `electron-vite build` first,
# so out/ is always fresh, and then electron-builder with no system named: it takes the targets of
# its own system from here.
#   macOS    an unpacked .app (mac.target: dir), ad-hoc signed, not notarized: dist/mac*/worfy.app.
#   Windows  an NSIS installer for x64 (worfy-windows ticket 12), not signed: dist/worfy Setup <version>.exe
#            and the unpacked app in dist/win-unpacked. It is built on Windows only: the Claude Code
#            binary and node-pty of the build are the ones pnpm installed for the system it ran on.
appId: dev.worfy.app # macOS notifications need a bundle id; on Windows it is the AppUserModelID
productName: worfy

directories:
  output: dist

files:
  - out/**
  # The Harness copy goes outside app.asar (extraResources below), not into it as well.
  - '!out/harness/**'
  - package.json

# The Harness copy of this build (electron.vite.config.ts writes out/harness/ with the build version
# in its plugin.json) sits in Contents/Resources/harness/: its scripts are run, and a file inside
# app.asar cannot be (ADR-0008). src/main/harness/bundled.ts finds it at process.resourcesPath.
#
# The status line bridge sits in Contents/Resources/statusline-bridge.sh, executable: the user's
# `statusLine` runs it from the .app, so Limits from the terminal do not depend on a checkout of
# this repository (worfy-harness ticket 15). The Harness migration form (src/main/harness/migrate/)
# proposes <process.resourcesPath>/statusline-bridge.sh by this name; do not rename or move it.
# It is the entry of statusline-bridge.mjs (Node, worfy-windows ticket 08), which goes next to it.
extraResources:
  - from: out/harness
    to: harness
  - from: scripts/statusline-bridge.sh
    to: statusline-bridge.sh
  - from: scripts/statusline-bridge.mjs
    to: statusline-bridge.mjs
  # Codex is Apache-2.0 and its npm packages carry neither file: LICENSE and NOTICE of the pinned
  # version (openai/codex at rust-v<version>) go next to the binary of the build, in
  # Contents/Resources/codex/ (worfy-multi-vendor ticket 17). Replace both with a new pin of
  # @openai/codex.
  - from: build/codex
    to: codex

# Package the Electron that is already installed instead of downloading another copy.
electronDist: node_modules/electron/dist

# node-pty is rebuilt for Electron's ABI by the postinstall script; packaging must not rebuild
# it again. Its pty.node and spawn-helper cannot be loaded or executed from inside app.asar.
npmRebuild: false
# The Agent SDK spawns Claude Code, the native binary of its platform package
# (@anthropic-ai/claude-agent-sdk-<platform>-<arch>/claude); a file inside app.asar cannot be
# spawned (ADR-0008). electron-builder's smart unpack copies executables out on its own; the
# explicit pattern keeps the build from depending on that heuristic.
# @xterm/headless is loaded by path in a worker thread that answers the shells' cursor-position
# requests (src/main/terminal/cursor-answers.ts, worfy-windows ticket 39); the worker does not
# count on reading inside app.asar.
# Codex (worfy-multi-vendor ticket 17) is the same: @openai/codex-<platform>-<arch> holds its
# native binary (vendor/<target>/bin/codex, codex.exe on Windows) with the helpers and resources it
# runs; src/main/vendors/codex/binary.ts finds it there.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  - node_modules/@openai/codex-*/**
  - node_modules/@xterm/headless/**

# Electron fuses, switches in the Electron binary that only a build can flip (worfy-auto-approve
# ticket 12). electron-builder flips them in the packaged worfy and worfy.exe right before signing;
# `pnpm dev` and the e2e runs of out/ start the stock Electron of node_modules, whose fuses are untouched.
# - runAsNode off: ELECTRON_RUN_AS_NODE does not turn worfy into a Node that any process of the
#   machine can run with worfy's rights and signature. A `.mjs` stand-in of a test (WORFY_GH,
#   WORFY_CLAUDE, WORFY_CODEX=fake) runs under node from the PATH in the packaged app instead
#   (src/main/program.ts, scriptRunner).
# - enableNodeCliInspectArguments off: --inspect and its kin are ignored, and `kill -USR1 <pid>`
#   no longer opens the Node inspector of the main process. With it, a Bash command of an agent
#   could write Auto-approval On into the memory of the settings store and close the inspector
#   before debugAccess() (src/main/settings/store.ts) looks. Playwright's _electron.launch needs
#   that inspector, so the packaged e2e tests drive a copy with this fuse turned back on
#   (test/e2e/fuses.ts); the tests of the fuses themselves read dist/ as it is built.
# The other fuses keep Electron's defaults; the reason for each is in the closing section of
# .scratch/worfy-auto-approve/issues/12-electron-fuses.md.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false

mac:
  target: dir
  # Drawn from build/brand/*.svg by `pnpm icons` (scripts/make-icons.mjs) and committed. Without it
  # electron-builder would use the Electron icon, or rasterize a build/icon.svg it found by itself.
  icon: build/icon.icns
  identity: '-' # ad-hoc signature: no certificate, no notarization
  hardenedRuntime: false
  notarize: false
  # "Link a machine" (worfy-link ticket 02) announces and searches `_worfy._tcp` by Bonjour; macOS 15
  # and later ask for the Local Network permission the first time (Apple TN3179). The description
  # is the text of that prompt; the service type is declared as TN3179 asks of a Bonjour client.
  extendInfo:
    NSLocalNetworkUsageDescription: worfy looks for worfy on your other computers in the local network and connects to the ones you link with Link a machine.
    NSBonjourServices:
      - _worfy._tcp

win:
  target:
    - target: nsis
      arch: x64
  # Seven PNGs packed by `pnpm icons` on a Mac from the same SVGs as icon.icns, and committed
  # (scripts/make-icons.mjs, scripts/ico.mjs). The icon of worfy.exe, of the installer and of the
  # shortcuts.
  icon: build/icon.ico
  # No certificate yet (signing is E4): the installer and worfy.exe are not signed, and SmartScreen
  # asks before the first run.

# The defaults of electron-builder: a one-click installer for the current user, without admin
# rights. A first install goes into %LOCALAPPDATA%\Programs\worfy: the folder is named after
# `name` of package.json, not after productName. A later install goes where the earlier one went
# (InstallLocation in the registry), and `/D=<folder>` on the command line names another folder.
#
# The installer stops every running program whose path starts with the path of its folder, with no
# backslash at the end. So scripts/install-stable.mjs keeps the stable copy out of Programs
# (%LOCALAPPDATA%\worfy-stable by default) and refuses a target whose path starts with that folder.

publish: null
