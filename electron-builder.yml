# Local macOS build of worfy: an unpacked .app (`--mac dir`), ad-hoc signed, not notarized.
# `pnpm package` runs `electron-vite build` first, so out/ is always fresh.
appId: dev.worfy.app # macOS notifications need a bundle id
productName: worfy

directories:
  output: dist

files:
  - out/**
  # The Harness copy goes outside app.asar (extraResources below), not into it as well.
  - '!out/harness/**'
  - package.json

# The Harness copy of this build (electron.vite.config.ts writes out/harness/ with the build version
# in its plugin.json) sits in Contents/Resources/harness/: its scripts are run, and a file inside
# app.asar cannot be (ADR-0008). src/main/harness/bundled.ts finds it at process.resourcesPath.
#
# The status line bridge sits in Contents/Resources/statusline-bridge.sh, executable: the user's
# `statusLine` runs it from the .app, so Limits from the terminal do not depend on a checkout of
# this repository (worfy-harness ticket 15). The Harness migration form (src/main/harness/migrate/)
# proposes <process.resourcesPath>/statusline-bridge.sh by this name; do not rename or move it.
extraResources:
  - from: out/harness
    to: harness
  - from: scripts/statusline-bridge.sh
    to: statusline-bridge.sh

# Package the Electron that is already installed instead of downloading another copy.
electronDist: node_modules/electron/dist

# node-pty is rebuilt for Electron's ABI by the postinstall script; packaging must not rebuild
# it again. Its pty.node and spawn-helper cannot be loaded or executed from inside app.asar.
npmRebuild: false
# The Agent SDK spawns Claude Code, the native binary of its platform package
# (@anthropic-ai/claude-agent-sdk-<platform>-<arch>/claude); a file inside app.asar cannot be
# spawned (ADR-0008). electron-builder's smart unpack copies executables out on its own; the
# explicit pattern keeps the build from depending on that heuristic.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**

mac:
  target: dir
  # Drawn from build/brand/*.svg by `pnpm icons` (scripts/make-icons.mjs) and committed. Without it
  # electron-builder would use the Electron icon, or rasterize a build/icon.svg it found by itself.
  icon: build/icon.icns
  identity: '-' # ad-hoc signature: no certificate, no notarization
  hardenedRuntime: false
  notarize: false

publish: null
