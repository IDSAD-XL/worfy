<!doctype html>
<!-- PROTOTYPE, throwaway: three variants of paste masking in the worfy prompt box, switchable via ?variant=A|B|C and the bottom bar. -->
<html lang="ru">
<head>

<title>Маскирование вставки · прототип</title>
<style>
/* worfy tokens, Graphite dark (src/renderer/theme/tokens.css), plus prototype-only category colours */
:root {
  color-scheme: dark;
  --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
  --bg: #121110; --canvas: #0f0e0d; --toolbar: #181715; --toolbar-border: #2e2b28;
  --surface: #1b1a18; --surface-raised: #22201e; --selected: #2a2825; --border: #2e2b28; --border-strong: #3b3834;
  --text: #ece8e1; --text-secondary: #c2bcb2; --text-muted: #9c968d;
  --primary: #c8f25a; --primary-text: #121110; --accent: #c8f25a;
  --working-text: #5e9bff; --working-bg: #1a2233; --blocked-text: #ffae5c; --blocked-bg: #2e2216; --blocked-ring: #ffae5c;
  --problem: #ff6b70; --problem-bg: rgba(255, 107, 112, .12); --segment-track: #22201e; --segment-thumb: #3b3834; --desk: #050505;
  --r-btn: 6px; --r-pop: 10px;
}
.k-secrets { --cc: #ff6b70; --cb: rgba(255, 107, 112, .2); }
.k-contacts { --cc: #5e9bff; --cb: rgba(94, 155, 255, .2); }
.k-finance { --cc: #e0a020; --cb: rgba(224, 160, 32, .2); }
.k-people { --cc: #be9fff; --cb: rgba(190, 159, 255, .2); }
.k-network { --cc: #39a2c6; --cb: rgba(57, 162, 198, .2); }
.k-ids { --cc: #95b0ba; --cb: rgba(149, 176, 186, .2); }
.k-words { --cc: #db668d; --cb: rgba(219, 102, 141, .2); }
.k-manual { --cc: #c8f25a; --cb: rgba(200, 242, 90, .18); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; overflow: hidden; background: var(--desk); color: var(--text); font: 13px/17px var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
code, .mono { font-family: var(--font-mono); }
:where(button, input, textarea):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.proto-banner { flex: none; display: flex; gap: 10px; align-items: baseline; margin: 10px 12px 8px; padding: 7px 12px; border: 1px solid var(--blocked-ring); border-radius: var(--r-btn); background: var(--blocked-bg); font-size: 12px; line-height: 16px; }
.proto-banner b { color: var(--blocked-text); white-space: nowrap; }
.win { flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0 12px 62px; overflow: hidden; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--bg); box-shadow: 0 18px 50px rgba(0,0,0,.5); }
.w-toolbar { flex: none; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--toolbar); border-bottom: 1px solid var(--toolbar-border); }
.tl { display: flex; gap: 8px; } .tl i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; } .tl i:nth-child(2) { background: #febc2e; } .tl i:nth-child(3) { background: #28c840; }
.w-title { font-weight: 600; } .w-sub { color: var(--text-muted); font-size: 11px; } .sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 4px; background: var(--surface-raised); color: var(--text-secondary); font-size: 11px; white-space: nowrap; }
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
.sess { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
/* chat */
.chat { flex: 1; min-height: 0; overflow: auto; padding: 12px 18px; display: flex; flex-direction: column; gap: 10px; }
.chat-h { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 11px; }
.chat-empty { margin: auto; max-width: 420px; text-align: center; color: var(--text-muted); }
.msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg--me { align-self: flex-end; background: var(--surface-raised); border: 1px solid var(--border); font: 11.5px/16px var(--font-mono); max-height: 260px; overflow: auto; }
.msg--ai { align-self: flex-start; background: transparent; border-left: 2px solid var(--accent); border-radius: 0; padding: 2px 0 2px 12px; }
.msg-cap { font-size: 10.5px; color: var(--text-muted); margin-top: -6px; }
.msg-cap--me { align-self: flex-end; }
.real { position: relative; text-decoration: underline dotted var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1.5px; cursor: help; }
.real:hover::after { content: attr(data-tip); position: absolute; left: 0; bottom: calc(100% + 4px); z-index: 20; padding: 3px 7px; border-radius: 5px; background: #f5f5f7; color: #111; font: 11px/14px var(--font-ui); white-space: nowrap; }
.ph { font-family: var(--font-mono); color: var(--accent); background: rgba(200, 242, 90, .1); border-radius: 3px; }
.ph.k-secrets, .ph.k-contacts, .ph.k-finance, .ph.k-people, .ph.k-network, .ph.k-ids, .ph.k-words, .ph.k-manual { color: var(--cc); background: var(--cb); }
/* composer and the prompt box (a textarea over a mirror div that paints chips, highlights and blur) */
.composer { position: relative; flex: none; padding: 8px 14px 10px; border-top: 1px solid var(--border); background: var(--bg); }
.pbox { position: relative; height: 34vh; min-height: 150px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); overflow: hidden; }
.pbox:focus-within { border-color: #5a554e; }
.pbox textarea, .pbox .mirror, .pbox .pv { position: absolute; inset: 0; margin: 0; padding: 9px 12px; border: 0; font: 12px/18px var(--font-mono); letter-spacing: 0; tab-size: 8; white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; scrollbar-gutter: stable; }
.pbox .mirror { overflow: hidden; color: var(--text); pointer-events: none; }
.pbox textarea { overflow-y: auto; background: transparent; color: transparent; caret-color: var(--text); resize: none; outline: none; }
.pbox textarea::placeholder { color: var(--text-muted); }
.pbox textarea::selection { background: rgba(94, 155, 255, .4); color: transparent; }
.pbox .pv { overflow-y: auto; background: var(--canvas); }
.m-chip { border-radius: 3px; background: var(--cb); color: transparent; text-shadow: 0 0 6px rgba(236, 232, 225, .95); box-shadow: inset 0 0 0 1px var(--cc); }
.m-open { box-shadow: inset 0 -1.5px 0 var(--cc); }
.m-hl { background: var(--cb); box-shadow: inset 0 -2px 0 var(--cc); }
.m-blur { filter: blur(3.5px); color: var(--cc); }
.m-pill { border-radius: 4px; background: var(--working-bg); color: var(--working-text); box-shadow: inset 0 0 0 1px rgba(94, 155, 255, .45); }
.c-under, .a-under { display: flex; align-items: center; gap: 10px; min-height: 24px; margin-top: 6px; font-size: 12px; color: var(--text-secondary); }
.bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.hint { color: var(--text-muted); font-size: 11px; }
.btn { height: 28px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--r-btn); background: var(--surface-raised); }
.btn:hover:not(:disabled) { background: var(--selected); }
.btn--primary { border-color: transparent; background: var(--primary); color: var(--primary-text); font-weight: 600; }
.btn--primary:hover:not(:disabled) { background: #d6f77e; }
.btn--warn { border-color: var(--problem); background: var(--problem-bg); color: var(--problem); }
.link { border: 0; padding: 0; background: none; color: var(--text-secondary); text-decoration: underline dotted; text-underline-offset: 3px; }
.link:hover { color: var(--text); }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--segment-track); }
.seg button { height: 24px; padding: 0 9px; border: 0; border-radius: var(--r-btn); background: transparent; color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
.seg button[aria-pressed='true'] { background: var(--segment-thumb); color: var(--text); font-weight: 600; }
.seg .custom[aria-pressed='true'] { color: var(--blocked-text); }
.strict-why { font-size: 11.5px; color: var(--problem); }
/* category list, shared by A's popover, B's sidebar and C's dropdown */
.cats { display: flex; flex-direction: column; gap: 2px; }
.cat { display: grid; grid-template-columns: 16px 8px 1fr auto; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.cat:hover { background: var(--hover, rgba(255,255,255,.05)); }
.cat input { margin: 0; accent-color: var(--accent); }
.cat .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--cc); }
.cat .cnt { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 12px; }
.cat-hint { margin: -2px 0 4px 37px; font-size: 11px; line-height: 14px; color: var(--text-muted); }
.words { width: calc(100% - 37px); margin: 0 0 4px 37px; min-height: 40px; padding: 4px 6px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--canvas); font: 11.5px/15px var(--font-mono); resize: vertical; }
/* popover and dropdown */
.pop { position: fixed; z-index: 3000; width: 300px; padding: 8px; border: 1px solid var(--border-strong); border-radius: var(--r-pop); background: var(--surface-raised); box-shadow: 0 12px 36px rgba(0,0,0,.6); }
.pop-h { display: flex; align-items: center; gap: 6px; padding: 2px 4px 6px; }
.pop-v { margin: 0 4px 6px; padding: 5px 7px; border-radius: 5px; background: var(--canvas); font: 11.5px/15px var(--font-mono); overflow-wrap: anywhere; filter: blur(4px); transition: filter .12s; }
.pop-v:hover { filter: none; }
.pop-b { display: block; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; }
.pop-b:hover:not(:disabled) { background: var(--selected); }
.pop-f { margin: 6px 4px 2px; padding-top: 6px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); }
.pop-t { margin: 8px 4px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
/* state panel */
.state { min-height: 0; overflow: auto; padding: 12px 14px 18px; background: var(--toolbar); display: flex; flex-direction: column; gap: 14px; }
.st-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
.st-h .sp { flex: 1; } .st-h em { font-style: normal; text-transform: none; letter-spacing: 0; }
.st-out { max-height: 30vh; overflow: auto; margin: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--canvas); font: 11px/16px var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.st-out .asis { background: var(--problem-bg); box-shadow: inset 0 -1.5px 0 var(--problem); }
.st-grid { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.st-grid td, .st-grid th { padding: 3px 4px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.st-grid th { font-weight: 500; color: var(--text-muted); font-size: 11px; }
.st-grid .num { text-align: right; }
.st-grid .off { color: var(--text-muted); }
.st-val { font-family: var(--font-mono); font-size: 11px; overflow-wrap: anywhere; filter: blur(4px); transition: filter .12s; }
.st-grid tr:hover .st-val { filter: none; }
.st-note { font-size: 11px; line-height: 15px; color: var(--text-muted); }
.st-new { color: var(--blocked-text); font-size: 10.5px; }
/* B: the review sheet over the composer */
.sheet { position: absolute; inset: 10px 10px 10px 10px; z-index: 50; display: flex; flex-direction: column; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); box-shadow: 0 -12px 44px rgba(0,0,0,.6); }
.sh-top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.sh-top h3 { margin: 0; font-size: 14px; }
.sh-mid { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr) minmax(0, 1fr); }
.sh-side { min-height: 0; overflow: auto; padding: 10px 8px; border-right: 1px solid var(--border); }
.sh-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 8px 10px; }
.sh-pane + .sh-pane { border-left: 1px solid var(--border); }
.sh-pane .pbox { flex: 1; height: auto; }
.sh-bot { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--border); }
/* C: the shield on Send and its dropdown */
.split { display: inline-flex; }
.split .shield { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border: 1px solid var(--border-strong); border-right: 0; border-radius: var(--r-btn) 0 0 var(--r-btn); background: var(--surface-raised); font-variant-numeric: tabular-nums; }
.split .btn--primary { border-radius: 0 var(--r-btn) var(--r-btn) 0; }
.shield.ok { color: var(--accent); } .shield.warn { color: var(--blocked-text); } .shield.bad { color: var(--problem); border-color: var(--problem); } .shield.zero { color: var(--text-muted); }
.drop { position: absolute; right: 14px; bottom: calc(100% - 4px); z-index: 60; width: 360px; max-height: 70vh; overflow: auto; padding: 10px; border: 1px solid var(--border-strong); border-radius: var(--r-pop); background: var(--surface-raised); box-shadow: 0 12px 36px rgba(0,0,0,.6); }
.slider { width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
.ticks { display: grid; grid-template-columns: repeat(4, 1fr); font-size: 10.5px; color: var(--text-muted); text-align: center; }
.ticks span:first-child { text-align: left; } .ticks span:last-child { text-align: right; }
.ticks .on { color: var(--text); font-weight: 600; }
.pv-banner { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; padding: 4px 8px; border-radius: 6px; background: var(--working-bg); color: var(--working-text); font-size: 12px; }
/* the variant switcher and sample buttons (prototype chrome, not part of the design) */
.vbar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5000; display: flex; align-items: center; gap: 2px; padding: 4px 6px; border-radius: 22px; background: #f5f5f7; color: #111; box-shadow: 0 8px 30px rgba(0,0,0,.6); font-size: 12px; white-space: nowrap; }
.vbar button { height: 30px; padding: 0 10px; border: 0; border-radius: 15px; background: transparent; color: #111; }
.vbar button:hover { background: rgba(0,0,0,.08); }
.vbar .arrow { width: 30px; padding: 0; font-size: 18px; }
.vlab { min-width: 200px; padding: 0 6px; text-align: center; font-weight: 600; line-height: 14px; }
.vlab b { color: #7a5d00; margin-right: 5px; } .vlab small { display: block; font-weight: 400; font-size: 10px; color: rgba(0,0,0,.55); }
.vbar .sep { width: 1px; height: 20px; margin: 0 4px; background: rgba(0,0,0,.15); }
</style>

<script>
(function () {
'use strict';
// ======================================================================
// Engine: detectors, structure-aware dumps, the placeholder table, the text the model gets, the canned reply.
// No DOM here, so node can run it for the headless check; the UI part returns early when `document` is absent.
// Secret-looking samples and the detector regexes are built from pieces, so this file's own text carries none.
// ======================================================================
var AT = String.fromCharCode(64), D5 = '-----', LQ = '\u2039', RQ = '\u203a';
var CATS = [
  { id: 'secrets', name: 'Секреты', hint: 'API key и token-ы по префиксам (GitHub, OpenAI/Anthropic sk-…, AWS, Slack, Stripe, Google), PEM-ключи, JWT, Bearer, пароли в URL и строках подключения, password= и *_KEY= / *_TOKEN= / *_SECRET=' },
  { id: 'contacts', name: 'Контакты', hint: 'email, телефоны' },
  { id: 'finance', name: 'Финансы', hint: 'номера карт (только прошедшие проверку Luhn), IBAN (проверка mod 97)' },
  { id: 'people', name: 'Люди', hint: 'имена только по колонкам дампа (name, full_name, fio, customer, client…); в свободном тексте имя скрывается, только если оно в своём списке слов; адреса, паспорт и ИНН, даты рождения' },
  { id: 'network', name: 'Сеть', hint: 'IPv4-адреса, внутренние имена хостов (*.internal, *.corp, *.lan…)' },
  { id: 'ids', name: 'Идентификаторы', hint: 'UUID и длинные hex-строки. Выключено во всех уровнях: git SHA и id в коде обычно не секрет, будет много ложных срабатываний' },
  { id: 'words', name: 'Свой список слов', hint: 'клиенты, компании, проекты: скрывать всегда. Через запятую' }
];
var LEVELS = [
  { name: 'Выключено', short: 'Выкл', cats: [] },
  { name: 'Секреты', short: 'Секреты', cats: ['secrets', 'finance', 'words'] },
  { name: 'Секреты и контакты', short: '+ контакты', cats: ['secrets', 'finance', 'words', 'contacts', 'network'] },
  { name: 'Всё личное', short: 'Всё личное', cats: ['secrets', 'finance', 'words', 'contacts', 'network', 'people'] }
];
var TYPE_CAT = { API_KEY: 'secrets', TOKEN: 'secrets', PRIVATE_KEY: 'secrets', PASSWORD: 'secrets', SECRET: 'secrets', EMAIL: 'contacts', PHONE: 'contacts',
  CARD: 'finance', IBAN: 'finance', NAME: 'people', ADDRESS: 'people', DOC: 'people', DOB: 'people', IP: 'network', HOST: 'network', ID: 'ids', HEX: 'ids', WORD: 'words', HIDDEN: 'manual' };
var TYPE_RU = { API_KEY: 'API key', TOKEN: 'token', PRIVATE_KEY: 'приватный ключ', PASSWORD: 'пароль', SECRET: 'секрет', EMAIL: 'email', PHONE: 'телефон', CARD: 'карта',
  IBAN: 'IBAN', NAME: 'имя', ADDRESS: 'адрес', DOC: 'документ', DOB: 'дата рождения', IP: 'IP', HOST: 'хост', ID: 'UUID', HEX: 'hex-строка', WORD: 'слово из списка', HIDDEN: 'скрыто вручную' };

function luhn(d) {
  if (d.length < 13 || d.length > 19 || /^(\d)\1+$/.test(d)) return false;
  var s = 0;
  for (var i = 0; i < d.length; i++) { var x = +d[d.length - 1 - i]; if (i % 2) { x *= 2; if (x > 9) x -= 9; } s += x; }

function phoneOk(v) { var d = v.replace(/\D/g, ''); return d.length >= 10 && d.length <= 15 && !/^\d{4}-\d\d-\d\d/.test(v); }
function assignOk(v) { return !/^(?:os\.|process\.|env\.|getenv|\$|<|%|none$|null$|true$|false$|undefined$|\*+$)/i.test(v) && !/[()[\]]/.test(v); }

function R(src, f) { return new RegExp(src, 'gd' + (f || '')); }
var NB = '(?<![A-Za-z0-9_])', NA = '(?![A-Za-z0-9_])', UP = '[A-ZА-ЯЁ][a-zа-яё]+';
var FIRST = 'Jane|John|Maria|Wei|Priya|Ahmed|Olga|Lucas|Emma|Kenji|Mary|James|Robert|Michael|David|Sarah|Laura|Anna|Peter|Paul|Daniel|Sophie|' +
  'Ольга|Мария|Анна|Ирина|Елена|Наталья|Татьяна|Светлана|Иван|Пётр|Петр|Сергей|Андрей|Дмитрий|Михаил|Николай|Павел|Екатерина|Юлия';
var KEYS = ['g' + 'h[pousr]_[A-Za-z0-9]{30,}', 'git' + 'hub_pat_[A-Za-z0-9_]{30,}', 's' + 'k-(?:ant-|proj-)?[A-Za-z0-9_-]{24,}', '(?:A' + 'KIA|A' + 'SIA)[0-9A-Z]{16}',
  'xo' + 'x[abposr]-[A-Za-z0-9-]{10,}', '(?:s' + 'k|r' + 'k)_(?:live|test)_[A-Za-z0-9]{16,}', 'AI' + 'za[0-9A-Za-z_-]{35}'];
// Order is priority: when two finds overlap, the earlier detector wins (after manual hides and dump columns).
var DET = [
  { t: 'PRIVATE_KEY', re: R(D5 + 'BEGIN [A-Z0-9 ]*PRIV' + 'ATE KEY' + D5 + '[\\s\\S]*?' + D5 + 'END [A-Z0-9 ]*PRIV' + 'ATE KEY' + D5) },
  { t: 'API_KEY', re: R(NB + '(?:' + KEYS.join('|') + ')' + NA) },
  { t: 'TOKEN', re: R(NB + 'ey' + 'J[A-Za-z0-9_-]{8,}\\.ey' + 'J[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}') },
  { t: 'TOKEN', re: R('Bear' + 'er\\s+([A-Za-z0-9._~+/-]{16,}=*)', 'i'), g: 1 },

  h('button', { class: 'arrow', type: 'button', title: 'Следующий вариант (] или →)', 'aria-label': 'Следующий вариант', text: '›', onclick: function () { cycle(1); } }), h('span', { class: 'sep' })]
