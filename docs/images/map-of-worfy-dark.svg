<!-- Generated by scripts/map-of-worfy-svg.mjs from src/renderer/guide/topics/map-of-worfy/spec.ts and en.json (dark theme). Do not edit by hand: run the script. -->
<title id="map-title">Map of worfy</title>
<desc id="map-desc">The Map of worfy. A Linked machine is linked to this Machine by a 6-digit code and, if access is on, opens the Canvas. This Machine hosts the Project and has one Harness. The Harness runs the Project by its Profile, guides the agents and includes the Gate. The Project has exactly one Canvas. On the Canvas, an Epic frame holds a Ticket and the Ready wave chip; a Session starts a Subagent, and both are bound to the Ticket; the Session may change a Card and arrives signed in to a Browser; a Terminal stands beside them. Autopilot runs the Wave without a person and waits for Limits to reset.</desc>
