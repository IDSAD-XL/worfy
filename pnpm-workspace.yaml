# Single package, not a workspace: there is no `packages` field.
# pnpm 11 no longer reads the "pnpm" field of package.json, so its settings live here.
# allowBuilds lists the packages whose install scripts must run; anything not listed
# makes `pnpm install` fail with ERR_PNPM_IGNORED_BUILDS instead of skipping silently.
allowBuilds:
  electron: true
  esbuild: true
  node-pty: true
  electron-winstaller: false

# Node 24 is required for development (`engines.node` of package.json). With that field alone
# pnpm 11.22.0 only warns under an older Node (`[WARN] Unsupported engine`), installs everything and
# exits 0. With engineStrict it stops before anything is installed: ERR_PNPM_UNSUPPORTED_ENGINE,
# exit code 1, the version it expects and the one it got. The setting also refuses a dependency
# whose own `engines` does not accept the Node that runs pnpm.
engineStrict: true
