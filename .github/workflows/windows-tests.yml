name: Windows tests

# Runs unit and contract tests on a clean Windows machine in one of two modes:
# - `files` (the default): a given list of 1 to 12 test files, job "listed-tests";
# - `full`: the whole `pnpm test` (unit and contract, no e2e), job "full-suite".
#
# Two ways to start it: by hand (workflow_dispatch, below), and from the CI workflow (ci.yml) on
# every pull request and every push to main (workflow_call): ci.yml calls the mode full once per
# shard, with the input "shard" (`1/4` … `4/4`), and the job runs `pnpm test --shard=<shard>`. Since
# 2026-10-28 the repository is public and a Windows runner minute costs nothing; the price limits
# below were written for the private repository, and they still hold for a run started by hand.
#
# Why a workflow of its own and not a job in ci.yml: "Run workflow" here starts one Windows job and
# never the macOS jobs of ci.yml, and the mode files has no place in ci.yml.
#
# The limits, all inside this file and scripts/windows-test-list.mjs. A Windows runner minute costs
# $0.010:
# - it has no push, pull request or timer trigger of its own: it starts from "Run workflow"
#   (workflow_dispatch) or from a call of ci.yml (workflow_call);
# - one dispatch runs exactly one job: "mode" is a choice of `files` and `full`, and each job runs
#   only under its own value; two jobs, no matrix;
# - mode files, $0.10 at most: the input "files" is an explicit list of 1 to 12 test files, and an
#   empty list is refused; every element is an existing *.test.ts or *.test.tsx file under
#   test/unit/ or test/contract/; a name with "e2e", "packaged" or "acceptance", a pattern, a folder
#   and an option are refused; the job runs `node scripts/vitest-electron.mjs <files>` and never
#   `pnpm test`; stopped after 10 minutes;
# - mode full, $0.60 at most: a list of files is refused, not ignored; the job runs `pnpm test` and
#   nothing else of the suite (no `test:e2e`, `test:package` or acceptance); stopped after 60
#   minutes. The limit is the measured run × 1.5, rounded up to 5 minutes: the first full run
#   (39841670369, 2026-10-22, main with this job) took 39.5 minutes, of it 38.4 minutes of vitest
#   (worfy-windows ticket 66).
# test/contract/windows-tests-workflow.test.ts pins each of them: loosening one turns the Linux CI red.
#
# The input "files" (mode files only): paths from the repository root with forward slashes, spelled
# as git lists them, separated by spaces, commas or line breaks. For example:
#   gh workflow run windows-tests.yml --ref <branch> \
#     -f files="test/unit/remote-links.test.ts test/unit/shell-resolve.test.ts"
#   gh workflow run windows-tests.yml --ref <branch> -f mode=full
# With --ref the run takes this file, the check script and the tests from that branch.
#
# Who runs it: the owner, and — by the owner's permission of 2026-10-12 and 2026-10-19 — the
# orchestrator Session on the Mac: the mode files before it merges a pull request with code for
# Windows; the mode full on the head of a platform pull request for which
# `node scripts/windows-verdict-scope.mjs <base> <head>` prints `runner`, and on main with each
# batch CI run of a wave (ADR-0071). This is the only exception to the project rule that agents
# never start paid runs: no other agent starts this workflow, and no agent starts the full macOS job
# of ci.yml. Neither mode replaces gate full on the owner's Windows PC for a pull request for which
# the script prints `pc` — one that touches the Terminal, windows, menus and notifications, e2e or
# packaging (ADR-0056, ADR-0071).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'files: the listed test files; full: the whole pnpm test (unit and contract, no e2e)'
        required: true
        type: choice
        default: files
        options:
          - files
          - full
      files:
        description: 'Mode files: test files under test/unit/ or test/contract/, separated by spaces or commas, 12 at most; empty in mode full'
        required: false
        type: string
  # ci.yml calls the mode full with a shard. The inputs of a call are strings: a choice exists only
  # for a dispatch, and a mode other than files or full runs neither job.
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      files:
        required: false
        type: string
        default: ''
      shard:
        description: 'Mode full: the part of the test files to run, as vitest --shard takes it (1/4); empty for all'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  listed-tests:
    if: inputs.mode == 'files'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The first step after checkout, before anything is installed: a refused list fails the job
      # within a minute. The script needs no dependencies and runs on the Node of the runner image.
      # The input reaches it through env. Written into `run` as an expression it would be pasted
      # into the script before the shell reads it, and a list such as `x; some-command` would run.
      # bash (Git Bash on the Windows image) is set for both steps that read TEST_FILES: the same
      # shell everywhere the list is handled, and the one whose word splitting the run step needs.
      - name: Check the list of test files
        id: list
        shell: bash
        env:
          TEST_FILES: ${{ inputs.files }}
        run: node scripts/windows-test-list.mjs
      # pnpm comes from corepack, which ships with Node 24, not from pnpm/action-setup. The action
      # installs a bootstrap pnpm with `npm ci` and then runs `pnpm self-update`. On 2026-10-22 npm's
      # audit request to the registry hung for 3 to 7 minutes in the runs started while several were
      # queued: the job hit its 10-minute limit before or just after the tests. "packageManager" in
      # package.json pins the version and the sha512 of its tarball, so `corepack install` downloads
      # that one tarball, checks it against the hash and asks the registry nothing else: 9 to 14 s
      # on the runner, most of it unpacking.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm with corepack
        shell: bash
        run: |
          corepack enable pnpm
          corepack install
      # Node 24 again, now with the pnpm store cache: the cache asks pnpm where its store is, so it
      # works only once pnpm is installed. The Node is already on the machine and is not downloaded.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The list is the output of the check — the accepted paths, separated by spaces — not the raw
      # input. $TEST_FILES is unquoted on purpose: bash splits it into one argument per file, and the
      # check allows no character that bash would expand. In PowerShell, the default shell on
      # Windows, `$TEST_FILES` would be an unset variable and vitest would run the whole suite;
      # `test -n` stops the step if the list is ever empty for any other reason.
      - name: Run the listed test files
        shell: bash
        env:
          TEST_FILES: ${{ steps.list.outputs.files }}
        run: |
          test -n "$TEST_FILES"
          node scripts/vitest-electron.mjs $TEST_FILES

  # The whole unit and contract suite. Its result is the Windows verdict of a platform pull request
  # for which scripts/windows-verdict-scope.mjs prints `runner` (ADR-0071).
  full-suite:
    if: inputs.mode == 'full'
    # The measured run × 1.5, rounded up to 5 minutes: 39.5 minutes on 2026-10-22 (run 39841670369).
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Before checkout: a dispatch that names files in this mode is a mistake of the caller, and
      # it fails within seconds instead of running the whole suite in place of the list it meant.
      # The input reaches the shell through env, as in the job of the list.
      - name: Refuse a list of files
        shell: bash
        env:
          TEST_FILES: ${{ inputs.files }}
        run: |
          test -z "$TEST_FILES" || { echo "::error::mode full runs the whole suite and takes no list of files; leave files empty or choose mode files"; exit 1; }
      - uses: actions/checkout@v7
      # pnpm from corepack, then Node with the pnpm store cache: the same three steps as in the job
      # of the list, for the same reasons.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm with corepack
        shell: bash
        run: |
          corepack enable pnpm
          corepack install
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm test` is `node scripts/vitest-electron.mjs`: vitest under Electron's Node, test/unit and
      # test/contract; vitest.config.ts leaves test/e2e and test/acceptance out. A call from ci.yml
      # passes a shard: vitest runs that part of the files and refuses a shard it cannot read. The
      # default shell (PowerShell) stays: the tests see the environment they always saw on Windows.
      - name: Run the whole unit and contract suite
        env:
          SHARD: ${{ inputs.shard }}
        run: |
          if ($env:SHARD) { pnpm test "--shard=$env:SHARD" } else { pnpm test }
