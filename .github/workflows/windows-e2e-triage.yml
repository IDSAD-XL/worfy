# Temporary: the e2e tests on the GitHub Windows runner, for the triage of their failures (worfy-throughput 44).
# Runs on the draft PR of the branch triage/windows-e2e only, and is never merged: the job of ci-ok comes in its own PR.
# Quarantined e2e tests run too (WORFY_QUARANTINE=run), so the triage sees every failure.
name: Windows e2e triage

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows-e2e:
    if: github.head_ref == 'triage/windows-e2e'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/4
          - 2/4
          - 3/4
          - 4/4
    steps:
      # Triage of the two tests that deny the runner's user access with icacls and still find the folder
      # readable or writable: which privileges the user's token has, and which of them are enabled.
      - name: The privileges and groups of the runner's user
        shell: pwsh
        run: |
          whoami
          whoami /priv
          whoami /groups
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the e2e tests, one shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          WORFY_QUARANTINE: run
        run: pnpm test:e2e "--shard=$SHARD"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-e2e-results-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
