name: CI

# CI checks every pull request and every push to main on GitHub-hosted runners, with what gate full
# runs on the owner's Mac: lint, typecheck, `pnpm test` (unit and contract), `pnpm test:e2e` and
# `pnpm test:package`. The repository is public, so the standard Linux, Windows and macOS runners
# cost nothing.
#
# - changes: which jobs this run needs (scripts/ci-scope.mjs). A change of documents only runs
#   lint-typecheck and skips the rest. A push to main runs every job. A pull request runs only the
#   macOS jobs its diff asks for: macos-e2e when it changes the app (harness/ included, which the app
#   carries), macos-tests (the macOS-only test files) when it changes the app, scripts/, harness/ or
#   one of those files, macos-package when it changes a build input.
# - lint-typecheck: pnpm lint and pnpm typecheck on Linux.
# - linux-tests: pnpm test on Linux in 4 shards (vitest --shard), files in a random order. A pull
#   request runs only the unit and contract test files its diff touches (scripts/affected-tests.mjs,
#   from the base ci-scope.mjs names, output tests-base): every shard computes the same list and
#   hands it to vitest (WORFY_TEST_FILES, read by scripts/vitest-electron.mjs), and --shard splits the
#   list, so each listed file still runs in exactly one shard. ALL runs the whole suite; an empty list
#   runs no vitest and the job succeeds, so ci-ok still holds it to success. A push to main and a run
#   by hand always run the whole suite. The Harness shell tests (test/contract/harness-scripts-<n>.test.ts)
#   run after the shard, alone, part <shard> of them in each shard.
# - macos-tests: pnpm test on macOS in one job: the tests that run on macOS only are checked here. A
#   push to main runs every file; a pull request the files with a macOS-only test or assertion
#   (scripts/ci-scope.mjs, output macos-tests-files).
# - macos-e2e: pnpm test:e2e on macOS in 2 shards, Electron with a window. scripts/e2e-shard.mjs gives
#   each shard its spec files by their measured time (test/e2e/timings.json), not by test count. A
#   pull request runs only the spec files its diff asks for (scripts/e2e-specs.table.json, output
#   e2e-files), in fewer shards when they take less time; any app path the table does not narrow runs
#   them all.
# - macos-package: pnpm test:package on macOS: the packaged .app. On every push to main, and on a
#   pull request that changes a build input (scripts/ci-scope.mjs: package.json, the lockfile, the
#   build configs, build/, the scripts the .app ships, the packaged tests, and the parts of this file
#   that package the app or run the e2e tests: the jobs changes, macos-e2e, macos-package and
#   windows-e2e, and the keys before jobs:). Such a change of this file runs every e2e spec file too;
#   a change of its other jobs or of a comment, and a change of windows-tests.yml, runs neither.
# - windows: the job full-suite of windows-tests.yml, pnpm test on Windows in 3 shards (vitest
#   --shard), jobs "windows (1/3) / full-suite" to "windows (3/3) / full-suite". In one job the heavy
#   contract files (harness-evals 943 s, harness-migrate 450 s, harness-scripts 421 s) ran at the same
#   time on one 4-CPU runner, the likely cause of its flaky tests. An earlier try with 4 shards
#   failed on Git Bash's /tmp, which test/global-setup-git-bash.ts now fixes for every vitest process.
#   The Harness shell tests (test/contract/harness-scripts-<n>.test.ts; as one file the longest of
#   shard 3/3, 354-617 s) run in two jobs of their own, "windows (harness-scripts 1/2)" and
#   "(harness-scripts 2/2)", each with half of them; the three shards leave those files out. A pull
#   request narrows these jobs as it narrows linux-tests: the shards split the list, and the two
#   harness-scripts jobs run only when the list has one of those files.
# - windows-e2e: pnpm test:e2e on Windows in 4 shards, whenever macos-e2e runs, on the same spec
#   files. It blocks ci-ok like every other job since ten push runs on main in a row had it green.
# - ci-ok: green when every job the run needs succeeded (scripts/ci-ok.mjs). A merge reads this check.
#
# The free plan runs 5 macOS jobs at a time, and pull requests waited 26 to 67 minutes for them while
# their longest job took 19. So a pull request asks for at most 3 of them (one macos-tests and two
# macos-e2e shards) when it changes the app, for one (macos-tests) when it changes only scripts or
# the Harness's tests and evals, and for none when it changes only unit or contract tests. The push to
# main runs them all.
#
# The manual run stays: Actions → CI → Run workflow, or `gh workflow run ci.yml --ref <ref> -f
# job=check` (lint, typecheck and the Linux shards — the batch run of a Wave) and `-f job=full-macos`
# (lint, typecheck and the macOS jobs).
#
# Never pull_request_target: a pull request runs with a read-only token and no secrets, and a pull
# request from a fork waits for approval (the repository's setting for outside contributors).
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      job:
        description: check — lint, typecheck, unit on Linux; full-macos — the macOS jobs
        type: choice
        default: check
        options:
          - check
          - full-macos

permissions:
  contents: read

# One run per pull request: a new push cancels the run of the older head. A push to main gets a
# group of its own, named by its commit: GitHub keeps at most one waiting run per group and cancels
# the older waiting one when a newer one arrives, so in one group for all of main the run of a merged
# pull request could be cancelled by the next merge, and a later run that compares with the newer
# commit would never test that code. Dispatches of the same job on the same branch go one at a time,
# as before.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.job || github.event_name }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      expect: ${{ steps.scope.outputs.expect }}
      macos-tests-files: ${{ steps.scope.outputs.macos-tests-files }}
      e2e-files: ${{ steps.scope.outputs.e2e-files }}
      macos-e2e-shards: ${{ steps.scope.outputs.macos-e2e-shards }}
      windows-e2e-shards: ${{ steps.scope.outputs.windows-e2e-shards }}
      tests-base: ${{ steps.scope.outputs.tests-base }}
    steps:
      # Two commits: the merge commit of a pull request and its first parent, the head of the base.
      # No checkout keeps the token in .git/config (persist-credentials: false): no step pushes or
      # calls the API with it. The one network call after checkout, ci-scope.mjs fetching the commit
      # main was at before a push, reads the public repository without a token, and if that fetch
      # fails the script runs every job.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      # A pull request compares its merge commit with the base it merges into; a push compares with
      # the commit main was at before it. The values reach the script through env, never as text of
      # the command.
      - name: Decide which jobs run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          JOB: ${{ inputs.job }}
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: node scripts/ci-scope.mjs

  lint-typecheck:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect)['lint-typecheck']
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the pnpm version pinned by "packageManager" in package.json. A third-party action:
      # pinned by the commit of its tag v6, so a moved tag cannot change what runs here.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Install scripts (electron, esbuild, node-pty) are allowed by allowBuilds in
      # pnpm-workspace.yaml; any other package with a build script fails the install.
      # The root postinstall rebuilds node-pty for Electron's ABI.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  linux-tests:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect)['linux-tests']
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/4
          - 2/4
          - 3/4
          - 4/4
    steps:
      # Two commits, as in the job changes: scripts/affected-tests.mjs compares the merge commit of a
      # pull request with its first parent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A pull request: the unit and contract test files its diff touches, the same list in every
      # shard (outputs run — all, none or some — and files). Skipped on a push and a run by hand, so
      # the next step runs the whole suite.
      - name: Pick the test files the pull request touches
        id: tests
        if: needs.changes.outputs.tests-base != ''
        env:
          BASE: ${{ needs.changes.outputs.tests-base }}
        run: node scripts/affected-tests.mjs "$BASE" HEAD --github-output
      # The shell tests of the Harness (test/contract/harness-scripts-<n>.test.ts) run the fenced blocks
      # of the skills under zsh too; the Ubuntu image has bash, git, jq and node but no zsh.
      - name: Install zsh
        run: command -v zsh || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh; }
      # vitest gives each shard a fixed part of the test files. Inside a shard the files run in a
      # random order (ADR-0036), so a test that passes only after or before another file turns red
      # here; the log names the seed ("Running tests with seed …") and
      # `pnpm test --shard=<shard> --sequence.shuffle.files --sequence.seed=<seed>` repeats the order.
      # The listed files reach vitest through WORFY_TEST_FILES (scripts/vitest-electron.mjs), and
      # --shard splits them; no list (all, or no pull request) is the whole suite.
      # The files of the Harness shell tests (HARNESS_SCRIPTS, test/harness-shell-tests.ts:
      # HARNESS_SCRIPTS_FILES) are left out here (WORFY_TEST_EXCLUDE, read by vitest.config.ts) and run
      # in the next step, after this one, with nothing else beside them.
      - name: Run unit and contract tests, one shard
        if: steps.tests.outputs.run != 'none'
        env:
          SHARD: ${{ matrix.shard }}
          WORFY_TEST_FILES: ${{ steps.tests.outputs.files }}
          WORFY_TEST_EXCLUDE: test/contract/harness-scripts-1.test.ts test/contract/harness-scripts-2.test.ts test/contract/harness-scripts-3.test.ts test/contract/harness-scripts-4.test.ts
        run: pnpm test "--shard=$SHARD" --sequence.shuffle.files
      # The Harness shell tests, part <shard> of them (HARNESS_SCRIPTS_PART, test/harness-shell-tests.ts):
      # harness-scripts-1.test.ts runs the part five at a time, the other files none, and no other test
      # file runs beside them. When they ran inside a shard, five or ten at once on this 4-CPU runner,
      # the beforeAll of test/unit/affected-tests.test.ts in the same shard ran past its 10 s limit
      # (runs 40946353000 and 40949170000, linux-tests (2/4)). A pull request runs them only when its
      # list has one of their files; the four go to vitest as arguments, and vitest fails when it finds
      # none of them, as the suite fails when the part holds no shell test.
      - name: Run the Harness shell tests, one part
        if: steps.tests.outputs.run != 'none'
        env:
          SHARD: ${{ matrix.shard }}
          HARNESS_SCRIPTS: test/contract/harness-scripts-1.test.ts test/contract/harness-scripts-2.test.ts test/contract/harness-scripts-3.test.ts test/contract/harness-scripts-4.test.ts
          TEST_FILES: ${{ steps.tests.outputs.files }}
        run: |
          run=; [ -n "$TEST_FILES" ] || run=yes; for file in $TEST_FILES; do case " $HARNESS_SCRIPTS " in *" $file "*) run=yes ;; esac; done
          if [ -z "$run" ]; then echo 'The list has no harness-scripts file: nothing to run'; else HARNESS_SCRIPTS_PART="$SHARD" pnpm test $HARNESS_SCRIPTS; fi
      # Tests must leave the source tree as they found it: no probe or other temporary file in src/.
      - name: src/ is unchanged after the tests
        run: |
          changed="$(git status --porcelain --untracked-files=all --ignored src)"
          if [ -n "$changed" ]; then
            echo "Tests left these changes in src/:"
            echo "$changed"
            exit 1
          fi

  macos-tests:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect)['macos-tests']
    runs-on: macos-latest
    # The two shards it replaced took up to 6.7 + 12.6 min together (run 40696174010), each with its
    # own install: the whole suite fits 45 min more than twice over.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A pull request hands the macOS-only test files, a push to main and a run by hand nothing:
      # every file. scripts/ci-scope.mjs names only plain test file names, one word each, so the
      # shell splits the list on its spaces. HARNESS_SCRIPTS_PART 1/1: one file runs
      # every Harness shell test, five at a time, so the whole suite on this runner never runs more.
      - name: Run unit and contract tests
        env:
          FILES: ${{ needs.changes.outputs.macos-tests-files }}
          HARNESS_SCRIPTS_PART: 1/1
        run: pnpm test $FILES

  macos-e2e:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect)['macos-e2e']
    runs-on: macos-latest
    timeout-minutes: 45
    # The shards come from scripts/ci-scope.mjs: two for every spec file, fewer when a pull request
    # runs only the spec files its diff asks for (output e2e-files), so no runner starts for nothing.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.macos-e2e-shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The display of the runner bounds the windows the e2e tests open: a window is never taller than
      # the screen. Its size is in the log for a test that fails on the size of its window.
      # system_profiler lists no display on the runner's virtual machine; AppKit gives the size.
      - name: Show the display of the runner
        run: osascript -l JavaScript scripts/ci-display.js
      # Playwright's --shard splits by the count of tests and left the heavy spec files almost all in
      # shard 1: 900–1121 s against 696–925 s for shard 2 on main (runs 40770425114 to 40788089367).
      # scripts/e2e-shard.mjs splits the spec files by their seconds in test/e2e/timings.json instead,
      # about 843 s of tests each, and hands this shard's files to the next step (output files). The
      # file names are plain, one word each, so the shell splits the list on its spaces. The script
      # fails rather than hand an empty list, which would run every file. On a pull request it splits
      # only the spec files the diff asks for (e2e-files, plain names); empty means every spec file.
      - name: Pick the spec files of this shard
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
          E2E_FILES: ${{ needs.changes.outputs.e2e-files }}
        run: node scripts/e2e-shard.mjs "$SHARD" $E2E_FILES
      # Builds the app into out/ and drives it with Playwright, on the spec files of this shard.
      - name: Run the e2e tests, one shard
        env:
          FILES: ${{ steps.shard.outputs.files }}
        run: pnpm test:e2e $FILES
      # A failing e2e test keeps the app's trace and a screenshot of its window under test-results/.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  macos-package:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect)['macos-package']
    runs-on: macos-latest
    timeout-minutes: 45
    # electron-builder skips signing in a pull request unless told otherwise, and the packaged tests
    # check the ad-hoc signature. The signature is ad-hoc (identity '-' in electron-builder.yml): no
    # certificate and no secret is involved.
    env:
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron 44 downloads its binary on the first require('electron'), not at install.
      # electron-builder copies the binary from node_modules/electron/dist (electronDist in
      # electron-builder.yml) and never requires electron, so on a clean machine the folder is missing.
      - name: Download the Electron binary
        run: node -e "require('electron')"
      # Packages dist/mac-*/worfy.app (ad-hoc signed) and drives the packaged app.
      - run: pnpm test:package
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # pnpm test on Windows: the job full-suite of the Windows workflow, one call per shard: three vitest
  # shards of every file but the Harness shell tests, and two parts of those shell tests. For
  # ci-ok, needs.windows.result is the result of all five: a failed or cancelled one makes it red.
  windows:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect)['windows']
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/3
          - 2/3
          - 3/3
          - harness-scripts 1/2
          - harness-scripts 2/2
    uses: ./.github/workflows/windows-tests.yml
    with:
      mode: full
      shard: ${{ matrix.shard }}
      tests-base: ${{ needs.changes.outputs.tests-base }}

  # pnpm test:e2e on Windows. Four shards for every spec file: in the runs of the triage one shard took
  # 7 to 15 min, so each stays under 20 min (runs 40710168910 to 40737039070, the longest shard 14.5 min
  # in 40719521332). A pull request that runs only the spec files its diff asks for gets fewer
  # (scripts/ci-scope.mjs, outputs e2e-files and windows-e2e-shards).
  windows-e2e:
    needs: changes
    if: fromJSON(needs.changes.outputs.expect)['windows-e2e']
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.windows-e2e-shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Under PowerShell, not Git Bash. The runner's user is an administrator, and its token holds the
      # backup and restore privileges, disabled. Git Bash (its MSYS2 runtime) enables both when it
      # starts; every process it starts inherits them — pnpm, Playwright, the app under test — and
      # Node (libuv) opens a folder with FILE_FLAG_BACKUP_SEMANTICS, so with them Windows does not
      # check the folder's ACL. The tests that deny the user a folder (icacls /deny) then still get in.
      # Under PowerShell both privileges stay disabled. The shard goes to playwright test, and so do
      # the spec files of a pull request (e2e-files, plain names separated by spaces): -split cuts the
      # list on its spaces, the filter drops the empty string an empty list leaves, and splatting the
      # variable (`@files`) makes each name one argument. No name: every spec file. An array
      # expression in its place, `@(-split …)`, reaches a PowerShell script shim of pnpm (pnpm.ps1) as
      # one argument holding the array, and the shim hands it to node as one string with every name in
      # it (the Harness shell test jobs of windows-tests.yml, run 40939802575).
      - name: Run the e2e tests, one shard
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
          E2E_FILES: ${{ needs.changes.outputs.e2e-files }}
        run: $files = @(-split $env:E2E_FILES | Where-Object { $_ }); pnpm test:e2e "--shard=$env:SHARD" @files
      # A failing e2e test keeps the app's trace and a screenshot of its window under test-results/.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-e2e-results-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Runs whatever happened before it (always()), so the check reports on every run; a cancelled run
  # reads as red, never as a skipped check.
  ci-ok:
    needs:
      - changes
      - lint-typecheck
      - linux-tests
      - macos-tests
      - macos-e2e
      - macos-package
      - windows
      - windows-e2e
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Every job the run needs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-ok.mjs
