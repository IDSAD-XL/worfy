name: CI

# CI is the cheap check: lint, typecheck and unit/contract tests on Linux.
# e2e tests and the packaged .app run on the owner's Mac before merge (gate full), because a
# macOS runner minute costs ten times a Linux one and e2e plus packaging took 6.5 of 8.7 minutes.
# The full macOS run stays available by hand: Actions → CI → Run workflow.
# Docs-only changes skip CI: Markdown at the root, docs/ and .scratch/. Markdown under src/ and test/
# is code (src/main/mcp/agent-instructions.md, test fixtures) and still runs it.
on:
  pull_request:
    paths-ignore: ['*.md', 'docs/**', '.scratch/**']
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', '.scratch/**']
  workflow_dispatch:

# A new push to the same pull request cancels the run still going for the previous one.
# A push to main gets a group of its own (the run id), so every merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version pinned by "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Install scripts (electron, esbuild, node-pty) are allowed by allowBuilds in
      # pnpm-workspace.yaml; any other package with a build script fails the install.
      # The root postinstall rebuilds node-pty for Electron's ABI.
      - run: pnpm install --frozen-lockfile
      # The shell tests of the Harness (test/contract/harness-scripts.test.ts) run the qmd scripts
      # under zsh; the Ubuntu image has bash, git, jq and node but no zsh.
      - name: Install zsh
        run: command -v zsh || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh; }
      - run: pnpm lint
      - run: pnpm typecheck
      # Test files run in a random order (ADR-0036), so a test that passes only after or before
      # another file turns red here; the log names the seed ("Running tests with seed …") and
      # `pnpm test --sequence.shuffle.files --sequence.seed=<seed>` repeats the order locally.
      # One shuffled run replaces the plain one: CI stays one test run long.
      - run: pnpm test --sequence.shuffle.files
      # Tests must leave the source tree as they found it: no probe or other temporary file in src/.
      - name: src/ is unchanged after the tests
        run: |
          changed="$(git status --porcelain --untracked-files=all --ignored src)"
          if [ -n "$changed" ]; then
            echo "Tests left these changes in src/:"
            echo "$changed"
            exit 1
          fi

  full-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Builds the app into out/ and drives it with Playwright.
      - run: pnpm test:e2e
      # Packages dist/mac-*/worfy.app (ad-hoc signed) and drives the packaged app.
      - run: pnpm test:package
      # A failing e2e test keeps the app's trace and a screenshot of its window under test-results/.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
